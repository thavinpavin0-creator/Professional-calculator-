
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalcPro Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <div class="top">
      <div class="app-name">CalcPro</div>
      <div>
        <button id="historyBtn">🕘</button>
        <button id="themeBtn">☀️</button>
      </div>
    </div>

    <div id="calculatorPage">
      <div class="display">
        <div id="historyPreview"></div>
        <div id="display">0</div>
      </div>

      <div class="buttons">
        <button class="function" data-action="clear">AC</button>
        <button class="function" data-action="delete">⌫</button>
        <button class="function" data-action="percent">%</button>
        <button class="operator" data-value="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>

        <button class="zero" data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="equals" data-action="calculate">=</button>
      </div>
    </div>

    <div id="historyPage" class="hidden">
      <div class="history-header">
        <h2>History</h2>
        <button id="clearHistoryBtn">🗑️</button>
      </div>
      <div id="historyList"></div>
      <button id="backBtn" class="back">← Back to Calculator</button>
    </div>

    <div class="footer">CalcPro • Version 2.0</div>
  </div>

  <script src="script.js"></script>
</body>
  </html>
